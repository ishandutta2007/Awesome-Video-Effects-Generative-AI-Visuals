<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 400"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070913"/><stop offset="50%" stop-color="#0e1329"/><stop offset="100%" stop-color="#140a2b"/></linearGradient><linearGradient id="neonGlow" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#ec4899"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#06b6d4"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity=".02"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="5"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.08)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0)}50%{transform:translateY(-15px) translateX(10px)}}@keyframes waveDash{0%{stroke-dashoffset:0}}@keyframes scanline{0%{transform:translateY(0);opacity:.1}50%{opacity:.35}}.badge-text,.subtitle,.title{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title{font-weight:900;font-size:44px;fill:#fff;letter-spacing:-1px}.subtitle{font-weight:500;font-size:19px;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}.ambient-sphere-1{animation:pulseGlow 7s ease-in-out infinite;transform-origin:200px 100px}.ambient-sphere-2{animation:pulseGlow 9s ease-in-out infinite reverse;transform-origin:1000px 300px}.flow-wave{stroke-dasharray:12,16;animation:waveDash 20s linear infinite}.p-float-1{animation:floatParticle 5s ease-in-out infinite}.p-float-2{animation:floatParticle 7s ease-in-out infinite 1s}.p-float-3{animation:floatParticle 6s ease-in-out infinite 2s}</style><rect width="1200" height="400" fill="url(#bgGrad)"/><circle cx="200" cy="90" r="140" fill="#8b5cf6" class="ambient-sphere-1" filter="url(#glow)" opacity=".35"/><circle cx="1020" cy="300" r="160" fill="#06b6d4" class="ambient-sphere-2" filter="url(#glow)" opacity=".3"/><circle cx="620" cy="380" r="130" fill="#ec4899" class="ambient-sphere-1" filter="url(#glow)" opacity=".2"/><path fill="none" stroke="url(#neonGlow)" stroke-width="2" d="M -50,320 Q 300,180 600,280 T 1250,220" class="flow-wave" opacity=".4"/><path fill="none" stroke="#8b5cf6" stroke-width="1.5" d="M -50,350 Q 280,240 650,330 T 1250,270" class="flow-wave" opacity=".25" style="animation-duration:26s"/><g stroke="#cbd5e1" stroke-width="1" opacity=".12"><line x1="100" x2="100" y1="0" y2="400"/><line x1="300" x2="300" y1="0" y2="400"/><line x1="500" x2="500" y1="0" y2="400"/><line x1="700" x2="700" y1="0" y2="400"/><line x1="900" x2="900" y1="0" y2="400"/><line x1="1100" x2="1100" y1="0" y2="400"/><line x1="0" x2="1200" y1="80" y2="80"/><line x1="0" x2="1200" y1="160" y2="160"/><line x1="0" x2="1200" y1="240" y2="240"/><line x1="0" x2="1200" y1="320" y2="320"/></g><circle cx="160" cy="280" r="4" fill="#ec4899" class="p-float-1" filter="url(#subtleGlow)"/><circle cx="1060" cy="110" r="5" fill="#38bdf8" class="p-float-2" filter="url(#subtleGlow)"/><circle cx="940" cy="220" r="3" fill="#a855f7" class="p-float-3" filter="url(#subtleGlow)"/><circle cx="240" cy="140" r="3.5" fill="#34d399" class="p-float-1" filter="url(#subtleGlow)"/><g text-anchor="middle" transform="translate(600, 115)"><rect width="370" height="34" x="-185" y="-55" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" opacity=".9" rx="17"/><text x="0" y="-33" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">✦ CURATED GENERATIVE AI VIDEO &amp; VFX ✦</text><text y="28" class="title">Awesome Video Effects &amp; Generative AI</text><text y="72" class="subtitle">Neural Style Transfer • Real-Time Diffusion • AI Rotoscoping • Relighting &amp; Motion Control</text></g><g transform="translate(130, 260)"><rect width="210" height="74" x="0" y="0" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity=".5" stroke-width="1.2" rx="12"/><circle cx="28" cy="37" r="14" fill="#ec4899" fill-opacity=".2"/><text x="28" y="42" font-size="16" text-anchor="middle">🎬</text><text x="52" y="32" class="badge-text" font-weight="700">Commercial SaaS</text><text x="52" y="52" fill="#94a3b8" class="subtitle" font-size="12">Runway, Pika, Luma, Kling</text><rect width="210" height="74" x="245" y="0" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-opacity=".5" stroke-width="1.2" rx="12"/><circle cx="273" cy="37" r="14" fill="#8b5cf6" fill-opacity=".2"/><text x="273" y="42" font-size="16" text-anchor="middle">⚡</text><text x="297" y="32" class="badge-text" font-weight="700">Diffusion &amp; Motion</text><text x="297" y="52" fill="#94a3b8" class="subtitle" font-size="12">ComfyUI, Wan2.1, LTX</text><rect width="210" height="74" x="490" y="0" fill="url(#cardGrad)" stroke="#06b6d4" stroke-opacity=".5" stroke-width="1.2" rx="12"/><circle cx="518" cy="37" r="14" fill="#06b6d4" fill-opacity=".2"/><text x="518" y="42" font-size="16" text-anchor="middle">✂️</text><text x="542" y="32" class="badge-text" font-weight="700">Matting &amp; Depth</text><text x="542" y="52" fill="#94a3b8" class="subtitle" font-size="12">SAM 2, RVM, Depth-V2</text><rect width="210" height="74" x="735" y="0" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity=".5" stroke-width="1.2" rx="12"/><circle cx="763" cy="37" r="14" fill="#10b981" fill-opacity=".2"/><text x="763" y="42" font-size="16" text-anchor="middle">💻</text><text x="787" y="32" class="badge-text" font-weight="700">Code &amp; Pipe