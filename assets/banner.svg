<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0e1329" />
      <stop offset="100%" stop-color="#140a2b" />
    </linearGradient>

    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <!-- Filter for soft neon glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 44px;
      fill: #ffffff;
      letter-spacing: -1px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }

    /* Ambient dynamic animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); }
      50% { transform: translateY(-15px) translateX(10px); }
    }
    @keyframes waveDash {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -400; }
    }
    @keyframes scanline {
      0% { transform: translateY(0); opacity: 0.1; }
      50% { opacity: 0.35; }
      100% { transform: translateY(400px); opacity: 0.1; }
    }

    .ambient-sphere-1 {
      animation: pulseGlow 7s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .ambient-sphere-2 {
      animation: pulseGlow 9s ease-in-out infinite reverse;
      transform-origin: 1000px 300px;
    }
    .flow-wave {
      stroke-dasharray: 12, 16;
      animation: waveDash 20s linear infinite;
    }
    .p-float-1 { animation: floatParticle 5s ease-in-out infinite; }
    .p-float-2 { animation: floatParticle 7s ease-in-out infinite 1s; }
    .p-float-3 { animation: floatParticle 6s ease-in-out infinite 2s; }
  </style>

  <!-- Deep Sci-Fi / VFX Canvas Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Ambient Animated Light Flares / Orbs (strictly background) -->
  <circle class="ambient-sphere-1" cx="200" cy="90" r="140" fill="#8b5cf6" filter="url(#glow)" opacity="0.35" />
  <circle class="ambient-sphere-2" cx="1020" cy="300" r="160" fill="#06b6d4" filter="url(#glow)" opacity="0.3" />
  <circle class="ambient-sphere-1" cx="620" cy="380" r="130" fill="#ec4899" filter="url(#glow)" opacity="0.2" />

  <!-- Digital VFX Timeline / Flow Curves -->
  <path class="flow-wave" d="M -50,320 Q 300,180 600,280 T 1250,220" fill="none" stroke="url(#neonGlow)" stroke-width="2" opacity="0.4" />
  <path class="flow-wave" d="M -50,350 Q 280,240 650,330 T 1250,270" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.25" style="animation-duration: 26s;" />

  <!-- Geometric Grid Accent Overlay (subtle perspective / VFX viewport grid) -->
  <g opacity="0.12" stroke="#cbd5e1" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400" />
    <line x1="300" y1="0" x2="300" y2="400" />
    <line x1="500" y1="0" x2="500" y2="400" />
    <line x1="700" y1="0" x2="700" y2="400" />
    <line x1="900" y1="0" x2="900" y2="400" />
    <line x1="1100" y1="0" x2="1100" y2="400" />
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
  </g>

  <!-- Glowing VFX Particles (background ambient) -->
  <circle class="p-float-1" cx="160" cy="280" r="4" fill="#ec4899" filter="url(#subtleGlow)" />
  <circle class="p-float-2" cx="1060" cy="110" r="5" fill="#38bdf8" filter="url(#subtleGlow)" />
  <circle class="p-float-3" cx="940" cy="220" r="3" fill="#a855f7" filter="url(#subtleGlow)" />
  <circle class="p-float-1" cx="240" cy="140" r="3.5" fill="#34d399" filter="url(#subtleGlow)" />

  <!-- Central Foreground Content (clean, crisp, prominent & always readable) -->
  <g transform="translate(600, 115)" text-anchor="middle">
    <!-- Super-category pill -->
    <rect x="-185" y="-55" width="370" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" opacity="0.9" />
    <text x="0" y="-33" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#c7d2fe" letter-spacing="2">
      ✦ CURATED GENERATIVE AI VIDEO &amp; VFX ✦
    </text>

    <!-- Main Title -->
    <text y="28" class="title">
      Awesome Video Effects &amp; Generative AI
    </text>

    <!-- Subtitle -->
    <text y="72" class="subtitle">
      Neural Style Transfer • Real-Time Diffusion • AI Rotoscoping • Relighting &amp; Motion Control
    </text>
  </g>

  <!-- Feature Pillar Floating Cards (Bottom Row) -->
  <g transform="translate(130, 260)">
    <!-- Card 1: SaaS Leaders -->
    <rect x="0" y="0" width="210" height="74" rx="12" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="28" cy="37" r="14" fill="#ec4899" fill-opacity="0.2" />
    <text x="28" y="42" text-anchor="middle" font-size="16">🎬</text>
    <text x="52" y="32" class="badge-text" font-weight="700">Commercial SaaS</text>
    <text x="52" y="52" class="subtitle" font-size="12" fill="#94a3b8">Runway, Pika, Luma, Kling</text>

    <!-- Card 2: Open Source Foundational Models -->
    <rect x="245" y="0" width="210" height="74" rx="12" fill="url(#cardGrad)" stroke="#8b5cf6" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="273" cy="37" r="14" fill="#8b5cf6" fill-opacity="0.2" />
    <text x="273" y="42" text-anchor="middle" font-size="16">⚡</text>
    <text x="297" y="32" class="badge-text" font-weight="700">Diffusion &amp; Motion</text>
    <text x="297" y="52" class="subtitle" font-size="12" fill="#94a3b8">ComfyUI, Wan2.1, LTX</text>

    <!-- Card 3: Neural Matting & Depth -->
    <rect x="490" y="0" width="210" height="74" rx="12" fill="url(#cardGrad)" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="518" cy="37" r="14" fill="#06b6d4" fill-opacity="0.2" />
    <text x="518" y="42" text-anchor="middle" font-size="16">✂️</text>
    <text x="542" y="32" class="badge-text" font-weight="700">Matting &amp; Depth</text>
    <text x="542" y="52" class="subtitle" font-size="12" fill="#94a3b8">SAM 2, RVM, Depth-V2</text>

    <!-- Card 4: Code & Motion Graphics -->
    <rect x="735" y="0" width="210" height="74" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="763" cy="37" r="14" fill="#10b981" fill-opacity="0.2" />
    <text x="763" y="42" text-anchor="middle" font-size="16">💻</text>
    <text x="787" y="32" class="badge-text" font-weight="700">Code &amp; Pipelines</text>
    <text x="787" y="52" class="subtitle" font-size="12" fill="#94a3b8">Remotion, FFmpeg, MoviePy</text>
  </g>

  <!-- Bottom Accent Gradient Border Line -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#neonGlow)" />
</svg>
